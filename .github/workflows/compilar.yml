name: Python installer

on:
  push:
  
 jobs: 
  build-linux:
     runs-on: ubuntu-latest

     steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
         witch:
             python-version '3.12'

      - run: pip install pyinstaller
      - run: pyinstaller --onefile comprova_desplegaments.py

  build-macos:
     runs-on: macos-latest

     steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
         witch: 
             python-version '3.12'

      - run: pip install pyinstaller
      - run: pyinstaller --onefile comprova_desplegaments.py

  build-windows:
     runs-on: windows-latest

     steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
         witch: 
             python-version '3.12'

      - run: pip install pyinstaller
      - run: pyinstaller --onefile comprova_desplegaments.py

  runs-on: ubuntu-latest
    steps:
     - uses: python comprova_desplegaments.py exemple.com
     - uses: python comprova_desplegaments.py exemple.com httpbin.org/status/500
     - uses: python comprova_desplegaments.py --fitxer urls.txt --eixida informe.csv
  


  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
          with: 
              path: dist

      - run: chmod +x dist/comprova_desplegaments
      - run: ./dist/comprova_desplegaments https://httpbin.org/status/200
