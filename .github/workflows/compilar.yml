name: Python installer

on:
  push:
  
 jobs: 
  build-linux:
     runs-on: ubuntu-latest

     steps:

      - name: actions/checkout@v4
      - name: actions/setup-python@v5
         witch:
             python-version '3.12'

      - run: pip install pyinstaller
      - run: pyinstaller --onefile comprova_desplegaments.py


